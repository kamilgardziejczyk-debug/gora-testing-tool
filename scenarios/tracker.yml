---
# Flashes an ESP32 tracker from scratch and captures its console.
#
# Neither `port` nor `firmware_dir` is set here, matching gateway.yml and the
# CI job: both name properties of the test *node*, not of the test, so they are
# supplied per run instead of baked into the scenario. Run it as:
#
#   python3 main.py -t scenarios/tracker.yml -p /dev/ttyUSB0 -f ./firmware
#
# All four images of the OTA layout are written, in ascending address order -
# bootloader at 0x0, partition table at 0x8000, otadata at 0x10000, app at
# 0x20000 - which is what a blank or repartitioned chip needs. Flashing
# otadata also resets the boot slot to ota_0, where the app is written.
#
# PREREQUISITE: the card's configuration.json must name "GoraHRV_01" as
# ble.hr_sensor_name; the Clean Up group checks it before the tracker runs.
#
# timeout_s guards against a device that never enters the ROM bootloader:
# esptool otherwise sits retrying its connect handshake. Note that it fails the
# step (stopping the scenario) rather than interrupting a write already under
# way - see README.md.
#
# The console and the programming port are the same wire on this board, so the
# flash is bracketed by !DutLogControl: capture is stopped before esptool takes
# the port and started again once it has finished. Without that, both would
# read /dev/ttyUSB0 at once and esptool would lose parts of its handshake to
# the logger. Unlike gateway.yml, whose RW612 logs on /dev/ttyACM0 while being
# flashed over SWD, nothing here can capture and flash at the same time.
#
# The wait for the reboot after esptool's hard reset sits on the *resume*, not
# on the flash: capture is running by then, so the tracker's whole boot lands
# in the device log instead of being slept through with nothing listening.
#
# The commands are split across !Group blocks so the report reads as a handful
# of stages rather than twenty-five flat rows. A group is a label and nothing else -
# the commands inside it run in order, in place - so how they are grouped
# cannot change what this scenario does. See README.md.

# Titles the run in the HTML report and in the combined log, in place of the
# filename. Optional - drop it and the report falls back to "tracker.yml".
name: "Tekpadz Tracker"

dut_log:
  port: "/dev/ttyUSB0"
  baud: 115200

usb_hub:
  ports:
    dut_storage: 3


groups:
  # Connect USB and power on the device
  - !Group
    name: "Initialization"
    commands:
      - !UsbSwitch
        name: "Connect storage USB"
        port: dut_storage
        state: 1
        wait_after_s: 1

      - !RelayControl
        name: "Turn on the device"
        relay: 1
        state: 1
        wait_after_s: 1

  # Flash the device. Both !DutLogControl commands are in this group with the
  # flash they bracket: the resume is the other half of the release, not a
  # stage of its own.
  - !Group
    name: "Flashing"
    commands:
      - !DutLogControl
        name: "Release The Console For Flashing"
        state: 0

      # Addresses follow flash_files in the build's flasher_args.json.
      - !ProgramEsptool:
        name: "Flash The Tracker"
        bootloader: "bootloader.bin"
        bootloader_address: 0x0
        partition_table: "partition-table.bin"
        partition_table_address: 0x8000
        ota_data: "ota_data_initial.bin"
        ota_data_address: 0x10000
        firmware: "tekpadz.bin"
        address: 0x20000
        port: "/dev/ttyUSB0"
        timeout_s: 30

  - !Group
      name: "Clean Up"
      commands:
            # Power on the device and start the test
        - !DutLogControl
          name: "Capture The Console Again"
          state: 1
          wait_after_s: 1

        - !DutLogExpect:
          name: "Device Hands The Card To The Host"
          validation: 'matches({line}, "USB Storage is now ACTIVE")'
          timeout_s: 30

        - !DutStorage:
          name: "Mount The Card"
          port: dut_storage
          action: mount
          mode: rw

        # The tracker only connects to the sensor named in the card's
        # configuration.json. !DutStorage cannot write it, so it is checked here.
        - !DutStorage:
          name: "Card Names The Sensor This Scenario Advertises"
          action: read
          path: "/configuration.json"
          validation: '"GoraHRV_01" in {content}'

        - !DutStorage:
          name: "Clear The Session Directories"
          action: delete
          path: "/session_*"
        
        - !DutStorage:
          name: "Unmount The Card"
          action: unmount

        - !DutStorage:
          name: "Eject The Card"
          port: dut_storage
          action: eject

        - !DutLogExpect:
          name: "Device Reclaims The Card On Eject"
          validation: 'matches({line}, "Storage control returned to ESP32")'
          timeout_s: 5

  # Tracker mode is what the firmware boots into when it is *not* USB powered:
  # app_main enters APP_RECORDING, which sends GNSS_MSG_START, and the GNSS FSM
  # walks GNSS_INACTIVE -> GNSS_WAITING_FIX -> GNSS_ACTIVE. The storage USB is
  # still switched off from Initialization, which is what makes the device come
  # up battery powered - connecting it before this group would boot the tracker
  # straight into USB storage mode and no fix would ever be attempted.
  - !Group
    name: "Tracker Mode"
    commands:
      - !BleHrvSimStart:
        name: "Advertise A Heart Rate Sensor"
        session: hrv
        device: "GoraHRV_01"
        bpm: 60
        seed: 1
        jitter_ms: 25
        interval_s: 1
        seed: 1

      - !RelayControl
        name: "Turn off the device"
        relay: 1
        state: 0
        wait_after_s: 1

      - !UsbSwitch
        name: "Disonnect storage USB"
        port: dut_storage
        state: 0
        wait_after_s: 1

      - !RelayControl
        name: "Turn on the device"
        relay: 1
        state: 1
        wait_after_s: 1

      - !DutLogExpect:
        name: "Tracker Finds The Sensor"
        validation: 'matches({line}, r"Matching HR sensor found! Name: GoraHRV_01")'
        timeout_s: 60

      - !DutLogExpect:
        name: "Tracker Discovers The Heart Rate Service"
        validation: 'matches({line}, r"Found HR Characteristic")'
        timeout_s: 30

      - !DutLogExpect:
        name: "Device Acquires A GNSS Fix"
        validation: 'matches({line}, r"GNSS FIX ACQUIRED with [0-9]+ satellites")'
        timeout_s: 300

      - !Loop
        name: "Record For Two Hours"
        iterations: 2
        commands:
          - !DutLogExpect:
            name: "Tracker Still Sampling"
            validation: 'matches({line}, r"GNSS Sample: Timestamp=[0-9]+ s")'
            since: command
            timeout_s: 60
            wait_after_s: 240

      - !BleHrvSimStop:
        name: "Stop The Sensor"
        session: hrv
        validation: "{subscribed} and {notifications} >= 60 and {rr_intervals} >= 60"
  # ... Let the device working ...

  # Mount the SD Card and read data files
  - !Group
    name: "Mass Storage Mode"
    commands:
      - !UsbSwitch
        name: "Connect storage USB"
        port: dut_storage
        state: 1

      # since: group - the Clean Up hand-off logged these same lines, and
      # would otherwise satisfy both checks in this group.
      - !DutLogExpect:
        name: "Device Hands The Card To The Host"
        validation: 'matches({line}, "USB Storage is now ACTIVE")'
        since: group
        timeout_s: 30

      - !DutStorage:
        name: "Mount The Card"
        port: dut_storage
        action: mount
        mode: rw

      - !DutStorage:
        name: "Card Holds A Log Directory"
        action: list
        path: "/"
        validation: "len(matching('session_*', {dirs})) == 1"

      - !DutStorage:
        name: "Pull The Logs Off The Card"
        action: copy_from
        path: "/session*"
        dest: "../results/sd"

      - !DutStorage:
        name: "Unmount The Card"
        action: unmount

      - !DutStorage:
        name: "Eject The Card"
        port: dut_storage
        action: eject

      - !DutLogExpect:
        name: "Device Reclaims The Card On Eject"
        validation: 'matches({line}, "Storage control returned to ESP32")'
        since: group
        timeout_s: 15

  # Clean up after tests
  - !Group
    name: "Teardown"
    commands:
      - !UsbSwitch
        name: "Disconnect storage USB"
        port: dut_storage
        state: 0
        wait_after_s: 1

      - !RelayControl
        name: "Turn off the device"
        relay: 1
        state: 0
        wait_after_ms: 100

  # The questions asked of what this run leaves behind - why a fix dropped,
  # whether the battery curve explains a gap - live in
  # `tracker.analysis.yml` and are answered after the run, off the bench:
  #
  #   python analysis/analyze.py --tasks scenarios/tracker.analysis.yml
  #
  # Nothing on the bench executes them: the scenario leaves logs and card
  # copies behind, and the questions are asked of those files afterwards. See
  # README.md.
