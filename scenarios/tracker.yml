---
# Flashes an ESP32 tracker from scratch.
#
# Neither `port` nor `firmware_dir` is set here, matching gateway.yml and the
# CI job: both name properties of the test *node*, not of the test, so they are
# supplied per run instead of baked into the scenario. Run it as:
#
#   python3 main.py -t scenarios/tracker.yml -p /dev/ttyUSB0 -f ./firmware
#
# All three images are written, in ascending address order - bootloader at
# 0x0000, partition table at 0x8000, app at 0x10000 - which is what a blank
# or repartitioned chip needs. Once a tracker is known to be provisioned,
# dropping `bootloader` and `partition_table` flashes the app alone and leaves
# what is already on the chip untouched.
#
# timeout_s guards against a device that never enters the ROM bootloader:
# esptool otherwise sits retrying its connect handshake. Note that it fails the
# step (stopping the scenario) rather than interrupting a write already under
# way - see README.md.
#
# wait_after_s covers the reboot after the hard reset esptool issues once the
# flash completes, so the next command does not talk to a device still coming
# up.

commands:

  - !RelayControl
    name: "Turn on the device"
    relay: 1
    state: 1
    wait_after_ms: 100

  - !ProgramEsptool:
    name: "Flash The Tracker"
    bootloader: "bootloader.bin"
    partition_table: "partition-table.bin"
    firmware: "tracker.bin"
    timeout_s: 180
    wait_after_s: 35
