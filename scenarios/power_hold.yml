---
# Powers the DUT and leaves it that way, for charging a flat battery or for
# working on the board by hand.
#
#   python3 main.py -t scenarios/power_hold.yml
#
# The relay and the hub port are held by the run itself: a scenario's cleanup
# releases the relay when it ends, so the hold is a command that simply takes a
# long time. Stop it with Ctrl-C (or `docker kill --signal=SIGINT`) when the
# board is charged - that runs the same cleanup and cuts power again.
name: "Hold The DUT Powered"

dut_log:
  port: "/dev/ttyUSB0"
  baud: 115200

usb_hub:
  ports:
    dut_storage: 3

groups:
  - !Group
    name: "Power The Board"
    commands:
      - !UsbSwitch
        name: "Connect storage USB"
        port: dut_storage
        state: 1
        wait_after_s: 1

      - !RelayControl
        name: "Turn on the device"
        relay: 1
        state: 1

      - !ExecuteCommand:
        name: "Hold Power For An Hour"
        command: "sleep 3600"
        timeout_s: 3700
