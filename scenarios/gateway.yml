---
# Listens for the messages a gateway forwards to AWS IoT Core.
#
# Note the ordering: !MqttSubscribe comes BEFORE the command that makes the
# device publish. It returns as soon as the broker confirms the subscription and
# then buffers in the background, so a gateway that forwards an uplink within
# milliseconds cannot publish before anything is listening.
#
# Certificate paths are relative to THIS file's directory.
#
# One !MqttSubscribe covers both topics on a single connection: the broker
# allows only one connection per client_id, so two separate subscriptions
# both using "gateway-01-test-listener" would evict each other. !MqttExpect's
# own `topic` field then picks which topic each check is counting.
#
# !MqttDisconnect at the end is optional - the runner closes any still-open
# session once the scenario ends anyway - but freeing "iot" here makes it
# explicit that the checks above are done with it.

commands:
  - !ProgramJlink:
    name: "J-Link NXP RW612 Flashing"
    device: "RW612"
    interface: "SWD"
    speed: 4000
    firmware: "zephyr.hex"
    wait_after_s: 15

  - !MqttSubscribe:
    name: "Listen for Device Shadow updates and SubGHz uplinks"
    session: "iot"
    endpoint: "a2onrynswccrx9-ats.iot.us-east-1.amazonaws.com"
    client_id: "gateway-01-test-listener"
    cert: "../tools/mqtt_listener/certs/device-cert.pem"
    private_key: "../tools/mqtt_listener/certs/device-key.pem"
    root_ca: "../tools/mqtt_listener/certs/root-ca.pem"
    topics:
      - "$aws/things/gateway-01/shadow/update"
      - "gora/gateway-01/subghz/#"

  - !MqttExpect:
    name: "Collect Device Shadow Messages"
    session: "iot"
    topic: "$aws/things/gateway-01/shadow/update"
    validation: "count == 1"
    timeout_s: 15

  - !SubghzSim:
    name: "Add simulated sensors"
    port: "/dev/ttyUSB0"
    baud: 115200
    duration_s: 30
    actions:
      - add: temp_hum
        wait_after_ms: 10
      - add: co
        wait_after_ms: 10

  - !MqttExpect:
    name: "Collect Mqtt Messages"
    session: "iot"
    topic: "gora/gateway-01/subghz/#"
    validation: "count == 12"
    timeout_s: 10

  - !MqttDisconnect:
    name: "Close the listener"
    session: "iot"
