---
# Listens for the messages a gateway forwards to AWS IoT Core.
#
# Note the ordering: !MqttSubscribe comes BEFORE the command that makes the
# device publish. It returns as soon as the broker confirms the subscription and
# then buffers in the background, so a gateway that forwards an uplink within
# milliseconds cannot publish before anything is listening.
#
# Certificate paths are relative to THIS file's directory.
#
# The first !BleCentral writes credentials and triggers a reset; the BLE link
# does not survive that, so a second, independent !BleCentral reconnects and
# waits for "online" before anything MQTT-related starts. scan_timeout_s is
# raised on that second command since the device needs time to reboot and
# start advertising again before a scan will find it. It reads the online
# characteristic (attempts: 15, every 2s) instead of subscribing to a
# notification for it - a real push notify is easy to miss in the narrow
# window right after reconnecting.
#
# One !MqttSubscribe covers both topics on a single connection: the broker
# allows only one connection per client_id, so two separate subscriptions
# both using "gateway-01-test-listener" would evict each other. !MqttExpect's
# own `topic` field then picks which topic each check is counting.
#
# !MqttDisconnect at the end is optional - the runner closes any still-open
# session once the scenario ends anyway - but freeing "iot" here makes it
# explicit that the checks above are done with it.
#
# The sub-GHz check counts `count_by: "seq"` - journal *samples*, not journal
# messages. The device uploads whatever it has accumulated every 120 s
# regardless of how much that is, so the number of messages 192 samples arrive
# in is a property of that timer, not of the gateway forwarding correctly:
# 192 samples could be one publish or five. `seq` is unique per sample, so
# counting distinct values is immune to the split, and to a QoS 1 redelivery
# arriving twice. timeout_s must therefore clear a whole upload period - the
# samples can land just after one fires, leaving a ~120 s wait for the next.
#
# !DutLogExpect checks the wall clock over the console, and sits deliberately
# BEFORE the shadow !MqttExpect. AWS IoT cannot be reached without a valid
# clock (TLS certificate validity is checked against it), so an unsynced device
# fails the shadow check too - but as "count == 0", which says nothing about
# why. Asserting the clock first turns that into the actual cause. Reference
# timings from a healthy run: clock set, AWS IoT connected 38 ms later, shadow
# published 83 ms later.
#
# The commands are split across !Group blocks so the report reads as a handful
# of stages rather than one flat list. A group is a label and nothing else -
# the commands inside it run in order, in place - so how they are grouped
# cannot change what this scenario does. In particular "Cloud Connection"
# opens the subscription that "Sub-GHz Uplink" counts on and "Teardown"
# closes: the session outlives the group it was created in, because groups
# have no setup or teardown of their own. See README.md.

name: "RW612 Gateway - flash, BLE onboarding and MQTT uplink"

dut_log:
  port: "/dev/ttyACM0"
  baud: 115200

dut_cli:
  port: "/dev/ttyACM1"
  baud: 115200

groups:
  - !Group
    name: "Flashing"
    commands:
      - !ProgramJlink:
        name: "Flash The Device"
        device: "RW612"
        interface: "SWD"
        speed: 4000
        firmware: "zephyr.hex"
        wait_after_s: 9

  # Clear anything the previous run left in the journal, then hand the device
  # its Wi-Fi credentials over BLE. The write triggers a reset, so this group
  # ends with the device rebooting - the link is not expected to survive it.
  - !Group
    name: "Provisioning"
    commands:
      - !DutCli:
        name: "Gateway Reports Itself Online"
        command: "journal clear"
        validation: 'matches({reply}, "Journal cleared")'
        timeout_s: 360

      - !RelayControl
        name: "Start BLE Advertising"
        relay: 1
        pulse_s: 4
        wait_after_ms: 100

      - !BleCentral:
        name: "Set Wifi Credentials And Reset"
        device: "GoraGateway_01B4EE"
        service: "9fd03f93-cb76-4f6f-84db-6ea8e5bf9f10"
        scan_timeout_s: 3
        wait_after_s: 9
        actions:
          - write:
              uuid: "9fd03f93-cb76-4f6f-84db-6ea8e5bf9f11"
              value: "dziewiatka"
              encoding: utf8
          - write:
              uuid: "9fd03f93-cb76-4f6f-84db-6ea8e5bf9f12"
              value: "Belussi-1988"
              encoding: utf8
          - write:
              uuid: "9fd03f93-cb76-4f6f-84db-6ea8e5bf9f13"
              value: "01"
          - write:
              uuid: "9fd03f93-cb76-4f6f-84db-6ea8e5bf9f14"
              value: "01"

  # The subscription is set up in this group rather than alongside the uplink
  # checks that read from it, for the reason in the header: it has to be
  # listening before the rebooted device publishes anything.
  - !Group
    name: "Cloud Connection"
    commands:
      - !MqttSubscribe:
        name: "Setup Mqtt Subscriber"
        session: "iot"
        endpoint: "a2onrynswccrx9-ats.iot.us-east-1.amazonaws.com"
        client_id: "gateway-01-test-listener"
        cert: "../tools/mqtt_listener/certs/device-cert.pem"
        private_key: "../tools/mqtt_listener/certs/device-key.pem"
        root_ca: "../tools/mqtt_listener/certs/root-ca.pem"
        topics:
          - "$aws/things/gateway-01/shadow/update"
          - "gora/gateway-01/journal"

      - !RelayControl
        name: "Start BLE Advertising"
        relay: 1
        pulse_s: 4
        wait_after_ms: 100

      - !BleCentral:
        name: "Wait For Device Online Over BLE"
        device: "GoraGateway_01B4EE"
        service: "9fd03f93-cb76-4f6f-84db-6ea8e5bf9f10"
        scan_timeout_s: 3
        actions:
          - read:
              uuid: "9fd03f93-cb76-4f6f-84db-6ea8e5bf9f15"
              validation: '{value} == "01"'
              attempts: 15
              retry_wait_ms: 2000

      - !DutLogExpect:
        name: "Wall Clock Set From NTP"
        validation: 'matches({line}, r"Wall clock set from \S+: unix=[0-9]+")'
        timeout_s: 60

      - !MqttExpect:
        name: "Collect Device Shadow Messages"
        session: "iot"
        topic: "$aws/things/gateway-01/shadow/update"
        validation: "{count} == 1"
        timeout_s: 15

  - !Group
    name: "Sub-GHz Uplink"
    commands:
      - !SubghzSim:
        name: "Add Simulated Sensors"
        port: "/dev/ttyUSB0"
        baud: 115200
        duration_s: 30
        actions:
          - add: temp_hum
            count: 8
          - add: co
            count: 8
          - add: smoke
            count: 8
          - add: heat
            count: 8

      - !MqttExpect:
        name: "Collect Simulated Sensors Messages"
        session: "iot"
        topic: "gora/gateway-01/journal"
        count_by: "seq"
        validation: "{count} == 192"
        timeout_s: 150

  - !Group
    name: "Teardown"
    commands:
      - !MqttDisconnect:
        name: "Close The Listener"
        session: "iot"
