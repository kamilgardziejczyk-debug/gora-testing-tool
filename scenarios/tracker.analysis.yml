---
# Questions asked of what a tracker run left behind, answered after the run:
#
#   python analysis/analyze.py --tasks scenarios/tracker.analysis.yml
#
# Nothing here runs on the bench. The scenario writes logs into `results/` and
# a `!DutStorage` `copy_from` pulls the card's session directories into
# `results/sd/`; these questions are asked of those files afterwards, on a
# machine that has a credential. Paths are globs, resolved against the
# directory you run the command from - the repository root.
#
# A task with no `files:` of its own is given whatever `--files` named, so a
# one-off question needs no edit here:
#
#   python analysis/analyze.py --tasks questions.yml --files results/*.device.log

tasks:
  - name: "Session gaps"
    files:
      - "results/*.device.log"
      - "results/sd/session_*/*.csv"
      - "results/*.combined.log"
    questions:
      - "What is the device run time?"
      - "Did the device restart during the test?"
      - "Are there any gaps in ADC, IMU and GNSS readings?"
      - "Please draw IMU, ADC charts, save them in PNG file"
      - "Please generate map file with the locations read from GNSS CVS. Return it in PNG file."
